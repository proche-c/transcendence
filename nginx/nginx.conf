upstream backend {
  server backend:8000;
}

server {
  listen 8443 ssl;
  server_name www.42pong.xyz;

  ssl_certificate /etc/nginx/ssl/transcendence.crt;
  ssl_certificate_key /etc/nginx/ssl/transcendence.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Détection dynamique de l'origine autorisée
  set $cors_origin "";

  if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|172\.16\.118\.59)(:\d+)?$") {
    set $cors_origin $http_origin;
  }

  # Bloc pour servir le frontend statique
  location / {
    # Gestion des requêtes OPTIONS
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Content-Type' 'text/plain; charset=UTF-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # CORS headers pour les réponses normales
    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
  }

  # Bloc pour les requêtes API
  location ^~ /api/ {
    # Gestion OPTIONS préflight
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Content-Type' 'text/plain; charset=UTF-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    proxy_pass http://backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_set_header Sec-WebSocket-Version 13;
    proxy_redirect off;
    proxy_ssl_verify off;

    # CORS headers pour les réponses API
    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
  }
}
